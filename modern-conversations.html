<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link
      rel="canonical"
      href="https://blog.florianherrengt.com/modern-conversations.html"
    />
    <meta
      name="description"
      content="An illustration of modern society conversations."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://blog.florianherrengt.com/modern-conversations.html"
    />
    <meta property="og:title" content="Modern society conversations" />
    <meta
      property="og:description"
      content="An illustration of modern society conversations."
    />
    <meta property="og:site_name" content="Blog - Florian Herrengt" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Modern society conversations" />
    <meta
      name="twitter:description"
      content="An illustration of modern society conversations."
    />
    <title>Modern society conversations</title>
    <style>
      body {
        max-width: 1080px;
      }

      .cy-flow {
        width: 100%;
        height: 340px;
        border: 1px solid #d0d0d0;
        border-radius: 8px;
        background: #faf9f6;
      }

      .cy-flow-fallback {
        padding: 24px;
        color: #202020;
      }

      @media (max-width: 620px) {
        .cy-flow {
          height: 560px;
        }
      }

      @media (prefers-color-scheme: dark) {
        .cy-flow {
          border-color: #4a4a4a;
          background: #1a1a1a;
        }

        .cy-flow-fallback {
          color: #f2f2f2;
        }
      }
    </style>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/cytoscape@3.34.1/dist/cytoscape.min.js"
      integrity="sha384-ynDqnMA1DginJi7wSwU6Ob7MKWUKK2+vwP2WXecQBlvo3hTRXKjKYOWuC1GUuyEy"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <h1>Modern society conversations</h1>
    </header>

    <figure>
      <div
        id="conversations-nn"
        class="cy-flow"
        role="img"
        aria-label="A neural network diagram. A bullet points email goes in on the left, passes through dense hidden layers of many nodes, and a bullet points email comes out on the right."
      >
        <p class="cy-flow-fallback">
          This illustration needs JavaScript to load Cytoscape from its CDN.
        </p>
      </div>
    </figure>

    <script>
      window.addEventListener("DOMContentLoaded", function () {
        var container = document.getElementById("conversations-nn");
        if (!container || typeof cytoscape !== "function") return;
        container.replaceChildren();

        var darkMode = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var mobileMode = window.matchMedia("(max-width: 620px)");

        var columnCounts = [3, 5, 3];
        var gap = 28;
        var palette = ["#e6f3ff", "#eee8ff", "#fff2cf", "#ffe7e2", "#e6f6ea"];

        var elements = [];
        var positions = { desktop: {}, mobile: {} };

        function place(id, desktop, mobile) {
          positions.desktop[id] = desktop;
          positions.mobile[id] = mobile;
        }

        elements.push({
          data: { id: "input", label: "bullet points\nemail" },
          classes: "email"
        });
        place("input", { x: 414, y: 300 }, { x: 240, y: 162 });

        elements.push({
          data: { id: "output", label: "bullet points\nemail" },
          classes: "email"
        });
        place("output", { x: 746, y: 300 }, { x: 240, y: 477 });

        var previousIds = ["input"];

        columnCounts.forEach(function (count, columnIndex) {
          var ids = [];

          for (var i = 0; i < count; i++) {
            var id = "hidden-" + columnIndex + "-" + i;
            elements.push({
              data: { id: id, label: "hidden layer" },
              classes: "hidden tone-" + ((i + columnIndex) % palette.length)
            });
            ids.push(id);
          }

          var columnX = 516 + columnIndex * 64;
          var rowY = 240 + columnIndex * 64;

          for (var j = 0; j < count; j++) {
            var offset = (j - (count - 1) / 2) * gap;
            place(ids[j], { x: columnX, y: 300 + offset }, { x: 240 + offset, y: rowY });
          }

          previousIds.forEach(function (source) {
            ids.forEach(function (target) {
              elements.push({ data: { source: source, target: target } });
            });
          });
          previousIds = ids;
        });

        previousIds.forEach(function (source) {
          elements.push({ data: { source: source, target: "output" } });
        });

        elements.push({
          data: { id: "hidden-caption", label: "hidden layers" },
          classes: "caption"
        });
        place("hidden-caption", { x: 580, y: 395 }, { x: 240, y: 405 });

        var toneStyles = palette.map(function (color, index) {
          return {
            selector: "node.tone-" + index,
            style: { "background-color": color }
          };
        });

        var flow = cytoscape({
          container: container,
          elements: elements,
          style: [
            {
              selector: "node.email",
              style: {
                shape: "round-rectangle",
                width: 130,
                height: 64,
                label: "data(label)",
                "text-wrap": "wrap",
                "text-max-width": 112,
                "text-valign": "center",
                "text-halign": "center",
                "font-family": "system-ui, sans-serif",
                "font-size": 16,
                "font-weight": 650,
                color: "#171717",
                "background-color": "#fff2cf",
                "border-width": 2,
                "border-color": "#242424"
              }
            },
            {
              selector: "node.hidden",
              style: {
                shape: "ellipse",
                width: 26,
                height: 26,
                "border-width": 1.5,
                "border-color": "#242424"
              }
            },
            {
              selector: "node.caption",
              style: {
                width: 24,
                height: 18,
                "background-opacity": 0,
                "border-width": 0,
                label: "data(label)",
                "font-family": "system-ui, sans-serif",
                "font-size": 15,
                "font-weight": 750,
                color: darkMode ? "#f2f2f2" : "#555555",
                "text-valign": "center",
                "text-halign": "center",
                "text-wrap": "none",
                "text-background-color": darkMode ? "#1a1a1a" : "#faf9f6",
                "text-background-opacity": 1,
                "text-background-padding": 4
              }
            },
            {
              selector: "edge",
              style: {
                width: 1,
                "curve-style": "straight",
                "line-color": darkMode ? "#c5c5c5" : "#303030",
                opacity: darkMode ? 0.16 : 0.22
              }
            }
          ].concat(toneStyles),
          layout: {
            name: "preset",
            positions: positions[mobileMode.matches ? "mobile" : "desktop"],
            fit: true,
            padding: 28
          },
          boxSelectionEnabled: false,
          autoungrabify: true,
          autounselectify: true
        });

        function layoutFlow() {
          flow
            .layout({
              name: "preset",
              positions: positions[mobileMode.matches ? "mobile" : "desktop"],
              fit: true,
              padding: 28,
              animate: false
            })
            .run();
        }

        mobileMode.addEventListener("change", layoutFlow);
        window.addEventListener("resize", function () {
          flow.resize();
          flow.fit(28);
        });
      });
    </script>
  </body>
</html>
