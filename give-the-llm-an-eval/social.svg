<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Do not tell the LLM how to solve it. Give it an eval.</title>
  <desc id="desc">A social preview showing a loop from generated world to agent attempt to exact score to next solution.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d1d1d" />
    </marker>
    <style>
      .headline { font: 800 68px system-ui, sans-serif; fill: #171717; }
      .box { fill: #fff; stroke: #1d1d1d; stroke-width: 3; rx: 16; }
      .copy { font: 700 23px system-ui, sans-serif; fill: #222; }
      .small { font: 18px system-ui, sans-serif; fill: #555; }
      .line { fill: none; stroke: #1d1d1d; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#faf5e9" />
  <circle cx="1090" cy="-25" r="240" fill="#dcecff" />
  <circle cx="80" cy="650" r="250" fill="#e3f3e7" />

  <text x="70" y="118" class="headline">Don't tell the LLM</text>
  <text x="70" y="198" class="headline">how to solve it.</text>
  <text x="70" y="278" class="headline" fill="#245c3b">Give it an eval.</text>

  <rect class="box" x="75" y="385" width="220" height="110" fill="#fff3d6" />
  <text x="185" y="431" text-anchor="middle" class="copy">Generated world</text>
  <text x="185" y="463" text-anchor="middle" class="small">known answer</text>

  <rect class="box" x="365" y="385" width="210" height="110" fill="#eaf5ff" />
  <text x="470" y="431" text-anchor="middle" class="copy">Agent attempt</text>
  <text x="470" y="463" text-anchor="middle" class="small">public web only</text>

  <rect class="box" x="645" y="385" width="190" height="110" fill="#fff0ee" />
  <text x="740" y="431" text-anchor="middle" class="copy">Exact score</text>
  <text x="740" y="463" text-anchor="middle" class="small">pass or fail</text>

  <rect class="box" x="905" y="385" width="220" height="110" fill="#f3edff" />
  <text x="1015" y="431" text-anchor="middle" class="copy">Next solution</text>
  <text x="1015" y="463" text-anchor="middle" class="small">coding LLM</text>

  <path class="line" d="M295 440 H365" />
  <path class="line" d="M575 440 H645" />
  <path class="line" d="M835 440 H905" />
  <path class="line" d="M1015 495 C1015 575 185 575 185 495" />

  <text x="70" y="585" class="small">Florian Herrengt</text>
</svg>
